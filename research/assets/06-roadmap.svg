<rect x="1012" y="416" width="218" height="150" rx="16" fill="#fff1d8" stroke="#9b6514" stroke-width="1.3"/>
<text x="1030" y="445" font-size="16" fill="#9b6514" font-weight="700" text-anchor="start">可选现场分支</text>
<text x="1030" y="476" font-size="22" fill="#9b6514" font-weight="700" text-anchor="start">实船测试</text>
<text x="1030" y="507" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">数据、场地与协议</text>
<text x="1030" y="536" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">到位后独立排期</text>
<path d="M988 491 H1008" stroke="#9b6514" stroke-width="2.4" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-9b6514)"/>
<rect x="44" y="629" width="1186" height="73" rx="14" fill="#ffffff" stroke="#aac0d1"/>
<text x="65" y="659" font-size="21" fill="#152d45" font-weight="700" text-anchor="start">完成 ≠ 到了某一周</text>
<text x="290" y="659" font-size="20" fill="#18354e" font-weight="400" text-anchor="start">阶段是否通过，以冻结指标、实验记录和失败分析为准。</text>
<text x="65" y="687" font-size="18" fill="#526c80" font-weight="400" text-anchor="start">P3/P4 积累的校准与部署方法用于 P6；船舶现场试验不是人形仿真学习的前置条件。</text>
<text x="36" y="734" font-size="15" fill="#526c80" font-weight="400" text-anchor="start">SHIP → HUMANOID  /  实施计划 v0.3  /  周次与门槛均为计划建议</text>
</g>
