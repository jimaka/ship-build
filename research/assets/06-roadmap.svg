<text x="788" y="236" font-size="22" fill="#7254a8" font-weight="700" text-anchor="start">人形入门</text>
<text x="788" y="267" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">站立 / 平地行走</text>
<text x="788" y="296" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">G5：参考任务复现</text>
<path d="M988 252 H1008" stroke="#7254a8" stroke-width="2.4" fill="none" marker-end="url(#arrow-7254a8)"/>
<rect x="1012" y="176" width="218" height="150" rx="16" fill="#f0eafa" stroke="#7254a8" stroke-width="1.3"/>
<text x="1030" y="205" font-size="16" fill="#7254a8" font-weight="700" text-anchor="start">P6 · W21–24</text>
<text x="1030" y="236" font-size="22" fill="#7254a8" font-weight="700" text-anchor="start">人形迁移</text>
<text x="1030" y="267" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">抗扰 / sim-to-sim</text>
<text x="1030" y="296" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">G6：部署准备</text>
<text x="770" y="365" font-size="18" fill="#7254a8" font-weight="400" text-anchor="start">S1/S2 通过后可先做人形入门</text>
<rect x="44" y="416" width="430" height="180" rx="16" fill="#fff1d8" stroke="#9b6514" stroke-width="1.3"/>
<text x="62" y="450" font-size="22" fill="#9b6514" font-weight="700" text-anchor="start">资源与数据分支</text>
<text x="62" y="483" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">P0 即开始确认船型、采集通道与场地</text>
<text x="62" y="512" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">没有实船数据：继续仿真及人形学习</text>
<text x="62" y="541" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">G3 真实数据验收仍保持未完成</text>
<rect x="528" y="416" width="218" height="150" rx="16" fill="#e5f4ef" stroke="#087c70" stroke-width="1.3"/>
<text x="546" y="445" font-size="16" fill="#087c70" font-weight="700" text-anchor="start">P3 · W10–13</text>
<text x="546" y="476" font-size="22" fill="#087c70" font-weight="700" text-anchor="start">数据与灰箱</text>
<text x="546" y="507" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">实船辨识 / 消融</text>
<text x="546" y="536" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">G3：模型证据</text>
<rect x="770" y="416" width="218" height="150" rx="16" fill="#e5f4ef" stroke="#087c70" stroke-width="1.3"/>
<text x="788" y="445" font-size="16" fill="#087c70" font-weight="700" text-anchor="start">P4 · W14–16</text>
<text x="788" y="476" font-size="22" fill="#087c70" font-weight="700" text-anchor="start">部署演练</text>
<text x="788" y="507" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">导出 / 回放 / 异常</text>
<text x="788" y="536" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">G4：软件在环</text>
