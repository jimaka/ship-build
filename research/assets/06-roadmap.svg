<text x="36" y="46" font-size="29" fill="#ffffff" font-weight="700" text-anchor="start">图 6-1  从船舶 RL 到人形控制：24 周实施路线</text>
<text x="36" y="80" font-size="17" fill="#c6d9e8" font-weight="400" text-anchor="start">建议投入：每周 15–20 小时  ·  时间按实际开工计  ·  实机测试独立排期</text>
<text x="44" y="150" font-size="22" fill="#152d45" font-weight="700" text-anchor="start">能力主线 · 先跑通船舶 PPO，再迁移训练与部署方法</text>
<rect x="44" y="176" width="218" height="150" rx="16" fill="#e8f2fd" stroke="#1768b3" stroke-width="1.3"/>
<text x="62" y="205" font-size="16" fill="#1768b3" font-weight="700" text-anchor="start">P0 · W1–2</text>
<text x="62" y="236" font-size="22" fill="#1768b3" font-weight="700" text-anchor="start">定义与勘误</text>
<text x="62" y="267" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">数学 / 数据 / 接口</text>
<text x="62" y="296" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">G0：关键歧义关闭</text>
<path d="M262 252 H282" stroke="#1768b3" stroke-width="2.4" fill="none" marker-end="url(#arrow-1768b3)"/>
<rect x="286" y="176" width="218" height="150" rx="16" fill="#e8f2fd" stroke="#1768b3" stroke-width="1.3"/>
<text x="304" y="205" font-size="16" fill="#1768b3" font-weight="700" text-anchor="start">P1 · W3–5</text>
<text x="304" y="236" font-size="22" fill="#1768b3" font-weight="700" text-anchor="start">环境与基线</text>
<text x="304" y="267" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">3DOF / 伺服 / 控制</text>
<text x="304" y="296" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">G1：环境检查通过</text>
<path d="M504 252 H524" stroke="#1768b3" stroke-width="2.4" fill="none" marker-end="url(#arrow-1768b3)"/>
<rect x="528" y="176" width="218" height="150" rx="16" fill="#e8f2fd" stroke="#1768b3" stroke-width="1.3"/>
<text x="546" y="205" font-size="16" fill="#1768b3" font-weight="700" text-anchor="start">P2 · W6–9</text>
<text x="546" y="236" font-size="22" fill="#1768b3" font-weight="700" text-anchor="start">船舶 PPO</text>
<text x="546" y="267" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">跟踪 → DP → 靠泊</text>
<text x="546" y="296" font-size="18" fill="#18354e" font-weight="400" text-anchor="start">G2：多种子评估</text>
<path d="M746 252 H766" stroke="#7254a8" stroke-width="2.4" fill="none" marker-end="url(#arrow-7254a8)"/>
