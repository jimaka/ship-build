<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="754" viewBox="0 0 1280 754" role="img" aria-labelledby="title desc">
<title id="title">图 6-1  从船舶 RL 到人形控制：24 周实施路线</title>
<desc id="desc">主线从P0定义勘误到P1船模基线、P2船舶PPO，再到P5人形入门与P6迁移。P3数据灰箱及P4部署演练作为分支提供方法积累，实船数据缺失不阻塞人形仿真学习。</desc>
